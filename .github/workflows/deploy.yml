name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HOST is not set; skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the SSH key
        if: steps.secrets.outputs.configured == 'true'
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # The production profile, not the development stack (tech.md 28.1): the
      # runtime image carries no test toolchain, no source is mounted over it
      # and Postgres keeps its port inside the compose network. The host owns
      # .env; the pipeline never writes it (tech.md 28.3).
      - name: Deploy
        if: steps.secrets.outputs.configured == 'true'
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -eu
             cd ${{ secrets.DEPLOY_PATH }}
             test -f .env
             git fetch --all
             git reset --hard origin/main
             compose='docker compose -f docker/compose.prod.yml'
             \$compose build
             \$compose run --rm migrator
             \$compose up -d bot worker
             \$compose ps"

      # up -d returns as soon as the container exists, so a process that dies
      # two seconds later still looks like a green deploy (tech.md 28.2).
      - name: Verify the stack
        if: steps.secrets.outputs.configured == 'true'
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -eu
             cd ${{ secrets.DEPLOY_PATH }}
             compose='docker compose -f docker/compose.prod.yml'
             ok=
             for _ in \$(seq 1 20); do
               if \$compose exec -T worker curl -fsS http://127.0.0.1:\${HEALTH_PORT:-8080}/healthz >/dev/null 2>&1 \
                  && [ \"\$(\$compose ps -q bot | xargs -r docker inspect -f '{{.State.Running}}')\" = true ]; then
                 ok=1
                 break
               fi
               sleep 5
             done
             if [ -z \"\$ok\" ]; then
               echo 'The stack did not come up.'
               \$compose ps
               \$compose logs --tail 50 bot worker
               exit 1
             fi
             \$compose exec -T worker curl -fsS http://127.0.0.1:\${HEALTH_PORT:-8080}/healthz"
