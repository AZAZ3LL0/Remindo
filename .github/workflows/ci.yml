name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  ENV: test
  BOT_TOKEN: "000000:fake-token-for-ci"
  USE_FAKE_BOT: "true"
  DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/reminder
  TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/reminder_test

jobs:
  gate:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: reminder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d reminder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck
        run: mypy app

      - name: Migrations on a clean database
        run: alembic upgrade head

      - name: Migrations are reversible and complete
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest --cov=app/domain --cov=app/services --cov-report=term-missing --cov-fail-under=85

  image:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime image
        run: docker build -f docker/Dockerfile --target runtime -t reminder:${{ github.sha }} .
