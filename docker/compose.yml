name: reminder

# Log rotation lives here and nowhere else (tech.md 24.5). The processes write
# a structured stream to stdout, docker owns the file, and a second rotator
# inside the container would only drift from this one.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-app: &app
  <<: *logging
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: dev
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+asyncpg://app:app@db:5432/reminder
  volumes:
    - ../:/srv
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    <<: *logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: reminder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Backups are taken by the container that owns pg_dump (tech.md 24.4).
      - ../scripts:/srv/scripts:ro
      - ../backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d reminder"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrator:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  bot:
    <<: *app
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "app.worker.main"]
    restart: unless-stopped
    # An endpoint with nobody asking is a metric, not a healthcheck. The port
    # stays inside the network: the check comes from within the container.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${HEALTH_PORT:-8080}/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  app:
    <<: *app
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/reminder
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@db:5432/reminder_test
    command: ["bash"]

volumes:
  pgdata:
