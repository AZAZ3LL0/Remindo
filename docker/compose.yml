name: reminder

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: dev
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+asyncpg://app:app@db:5432/reminder
  volumes:
    - ../:/srv
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: reminder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d reminder"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrator:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  bot:
    <<: *app
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "app.worker.main"]
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  app:
    <<: *app
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/reminder
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@db:5432/reminder_test
    command: ["bash"]

volumes:
  pgdata:
